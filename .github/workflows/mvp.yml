name: Mock MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting and lint
        run: |
          cargo +1.96.0 fmt --all -- --check
          cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test and build the shared core and entry points
        run: |
          cargo +1.96.0 test --workspace --locked
          cargo +1.96.0 build --workspace --locked
      - name: Verify runtime contracts and lifecycle
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/verify_mvp.py
          python scripts/verify_native_contract.py
      - name: Verify localization
        run: node packages/presentation/test/i18n.test.mjs
  ios-native:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
      # Fictional build scope: no signing, Keychain calls or account access.
      HOMEVERB_IOS_KEYCHAIN_ACCESS_GROUP: 'SYNTHETIC.org.homeverb.test'
    steps:
      - uses: actions/checkout@v4
      - name: Install the tested Rust targets
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy --target aarch64-apple-ios --target aarch64-apple-ios-sim
          cargo fetch --locked
      - name: Test Keychain orchestration and Core Foundation query objects
        run: cargo test -p homeverb-secrets --offline --locked ios::
      - name: Check and link the iOS native library
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo clippy -p homeverb-secrets --target "$target" --offline --locked -- -D warnings
            cargo build -p homeverb-ffi --target "$target" --offline --locked
          done
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the tested Android toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "ndk;28.2.13676358"
          cargo fetch --locked
      - name: Verify platform helpers and the credential JNI bridge
        run: |
          python scripts/verify_android_store.py \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --java-home "$JAVA_HOME"
      - name: Build and inspect Android native libraries
        run: |
          for variant in arm64-v8a x86_64 universal; do
            abis=(--abi "$variant")
            if [ "$variant" = universal ]; then
              abis=(--abi arm64-v8a --abi x86_64)
            fi
            python scripts/build_android_native.py \
              --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
              --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
              --java-home "$JAVA_HOME" \
              "${abis[@]}"
          done

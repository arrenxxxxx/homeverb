name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-preflight:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.HOMEVERB_TEST_KEYSTORE_BASE64 }}
          TEST_STORE_PASSWORD: ${{ secrets.HOMEVERB_TEST_STORE_PASSWORD }}
        run: |
          if [ -n "$TEST_KEYSTORE_BASE64" ] && [ -n "$TEST_STORE_PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Test APK skipped: configure both test-signing Secrets first.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: signing-preflight
    # Never publish code from a manually selected non-main branch.
    if: github.ref == 'refs/heads/main' && needs.signing-preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
      HOMEVERB_TEST_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Install Android and Rust targets
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;28.2.13676358"
          cargo fetch --locked
      - name: Build matching Core AAR
        run: |
          python scripts/build_android_native.py \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" \
            --java-home "$JAVA_HOME" --abi arm64-v8a --abi x86_64
      - name: Build isolated Meiju test APK
        working-directory: apps/mobile
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.HOMEVERB_TEST_KEYSTORE_BASE64 }}
          HOMEVERB_TEST_STORE_PASSWORD: ${{ secrets.HOMEVERB_TEST_STORE_PASSWORD }}
          HOMEVERB_TEST_KEYSTORE: ${{ runner.temp }}/homeverb-test.p12
        run: |
          test -n "$TEST_KEYSTORE_BASE64" && test -n "$HOMEVERB_TEST_STORE_PASSWORD"
          umask 077
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$HOMEVERB_TEST_KEYSTORE"
          unset TEST_KEYSTORE_BASE64
          trap 'rm -f "$HOMEVERB_TEST_KEYSTORE"' EXIT
          flutter build apk --release --target-platform android-arm64,android-x64 \
            --dart-define=HOMEVERB_ADAPTER=midea.meiju \
            --build-name=0.2.0-test --build-number="$GITHUB_RUN_NUMBER"
          mkdir -p ../../test-apk
          cp build/app/outputs/flutter-apk/app-release.apk ../../test-apk/HomeVerb-0.2.0-test.apk
          cd ../../test-apk
          sha256sum HomeVerb-0.2.0-test.apk > SHA256SUMS.txt
      - name: Verify APK identity, ABIs, and signature
        run: |
          apk=test-apk/HomeVerb-0.2.0-test.apk
          tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          badging=$("$tools_dir/aapt" dump badging "$apk")
          grep -F "package: name='dev.homeverb.homeverb_mobile.test'" <<<"$badging"
          grep -F "versionName='0.2.0-test'" <<<"$badging"
          "$tools_dir/apksigner" verify --verbose "$apk"
          python - "$apk" <<'PYCODE'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
          for abi in ('arm64-v8a', 'x86_64'):
              assert f'lib/{abi}/libhomeverb_ffi.so' in names, abi
          assert not any(n.startswith(('lib/armeabi-v7a/', 'lib/x86/')) for n in names)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: HomeVerb-0.2.0-test-${{ github.run_id }}
          path: test-apk/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HomeVerb-0.2.0-test-${{ github.run_id }}
          path: test-apk
      - name: Publish a separate test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd test-apk
          sha256sum --check SHA256SUMS.txt
          tag="test-v0.2.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" HomeVerb-0.2.0-test.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "HomeVerb 0.2.0 test (run $GITHUB_RUN_NUMBER)" \
            --notes "Test build from commit $GITHUB_SHA. Not an official release. The test package uses a separate application ID. See the Android CI test APK section of the mobile README for signing and installation limitations." \
            --draft --prerelease --latest=false
          gh release edit "$tag" --draft=false --prerelease --latest=false

<text x="680" y="657" font-size="15" fill="#607594" font-weight="400">Timestamps / source / unknown</text>
<rect x="994" y="397" width="278" height="330" rx="16" fill="#fffdf7" stroke="#e8ddbf" stroke-width="1.2"/>

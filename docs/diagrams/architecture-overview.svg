<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1390" viewBox="0 0 1320 1390" role="img" aria-labelledby="title desc">
<title id="title">HomeVerb architecture without a persistent service</title>
<desc id="desc">CLI, App, and MCP each embed the same control library and directly access appliance LAN interfaces or vendor clouds. No HA, NAS gateway, project backend, or background automation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a9bb1"/></marker></defs>
<rect width="1320" height="1390" fill="#f5f7fc"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="48" y="44" font-size="15" fill="#52709a" font-weight="700">HOMEVERB / ARCHITECTURE BASELINE</text>
<text x="48" y="91" font-size="32" fill="#152d4a" font-weight="700">Cross-brand control. No persistent service.</text>
<text x="48" y="126" font-size="21" fill="#607594" font-weight="400">One embedded library. Three independent hosts. No central server.</text>
<rect x="48" y="159" width="392" height="170" rx="16" fill="#e9efff" stroke="#e9efff" stroke-width="1.2"/>
<text x="70" y="199" font-size="25" fill="#315db5" font-weight="700">CLI process</text>
<text x="70" y="242" font-size="17" fill="#344f6d" font-weight="400">Command parsing / structured JSON</text>
<text x="70" y="282" font-size="17" fill="#315db5" font-weight="700">Embedded Core / exit on completion</text>
<line x1="244" y1="329" x2="244" y2="349" stroke="#8a9bb1" stroke-width="1.8" stroke-dasharray="6 5"/>
<rect x="464" y="159" width="392" height="170" rx="16" fill="#e6f3ef" stroke="#e6f3ef" stroke-width="1.2"/>
<text x="486" y="199" font-size="25" fill="#147760" font-weight="700">Mobile app process</text>
<text x="486" y="242" font-size="17" fill="#344f6d" font-weight="400">Flutter UI / in-process FFI</text>
<text x="486" y="282" font-size="17" fill="#147760" font-weight="700">Embedded Core / foreground only</text>
<line x1="660" y1="329" x2="660" y2="349" stroke="#8a9bb1" stroke-width="1.8" stroke-dasharray="6 5"/>
<rect x="880" y="159" width="392" height="170" rx="16" fill="#f0eafd" stroke="#f0eafd" stroke-width="1.2"/>
<text x="902" y="199" font-size="25" fill="#7150a4" font-weight="700">MCP session process</text>
<text x="902" y="242" font-size="17" fill="#344f6d" font-weight="400">AI host / stdio tool calls</text>
<text x="902" y="282" font-size="17" fill="#7150a4" font-weight="700">Embedded Core / host-owned lifetime</text>
<line x1="1076" y1="329" x2="1076" y2="349" stroke="#8a9bb1" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="212" y="369" font-size="19" fill="#607594" font-weight="400">Shared code loaded by each host below - not a network service</text>

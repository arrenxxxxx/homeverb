<text x="698" y="1120" font-size="20" fill="#526f9d" font-weight="400">Direct authorized access; not a project backend</text>
<text x="698" y="1158" font-size="17" fill="#7188ad" font-weight="400">Backend-only confidential auth flows are excluded.</text>

<text x="70" y="1307" font-size="21" fill="#dce6f5" font-weight="400">HA / NAS gateways / daemons / project backend / HTTP MCP / background automation</text>
<text x="48" y="1365" font-size="16" fill="#7184a0" font-weight="400">Baseline v0.1.1-docs | MCP may await calls during its host session; no device polling or background jobs.</text>

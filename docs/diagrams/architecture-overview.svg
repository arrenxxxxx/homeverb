<text x="70" y="1077" font-size="26" fill="#226471" font-weight="700">Appliance LAN interfaces</text>
<text x="70" y="1120" font-size="20" fill="#427484" font-weight="400">Direct access by the current client process</text>
<text x="70" y="1158" font-size="17" fill="#61868d" font-weight="400">LAN-only targets must be reachable from that client.</text>

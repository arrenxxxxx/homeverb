<text x="1014" y="520" font-size="17" fill="#777767" font-weight="400">Devices / config / snapshots</text>
<line x1="1014" y1="543" x2="1252" y2="543" stroke="#8a9bb1" stroke-width="1.8"/>
<text x="1014" y="583" font-size="21" fill="#505449" font-weight="700">System secret store</text>

<text x="68" y="438" font-size="27" fill="#152d4a" font-weight="700">Unified control Core</text>
<text x="744" y="438" font-size="17" fill="#7184a0" font-weight="400">In-process library</text>
<rect x="68" y="465" width="280" height="98" rx="11" fill="#f5f8fe" stroke="#dfe7f4" stroke-width="1.2"/>
<text x="84" y="500" font-size="23" fill="#254d76" font-weight="700">Accounts and auth</text>
